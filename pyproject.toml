[project]
name = "djippk"
version = "0.1.0"
description = "PPK of DJI RTK drone flights with RTKLIB: trajectory, per-photo positions and image geotagging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Ioli", email = "frency.ioli@gmail.com" }]
keywords = ["gnss", "ppk", "rtklib", "drone", "dji", "photogrammetry", "geotagging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2",
    "gnsskit @ git+https://github.com/franioli/gnsskit@v0.1.0",
]

[project.optional-dependencies]
plots = ["matplotlib"]

[project.scripts]
djippk = "djippk.cli:main"

[dependency-groups]
dev = ["pytest", "pillow", "matplotlib"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
